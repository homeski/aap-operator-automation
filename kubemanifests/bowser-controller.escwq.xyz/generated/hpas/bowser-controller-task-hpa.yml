apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bowser-controller-task-hpa
  namespace: aap-bowser
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
  maxReplicas: 3
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bowser-controller-task
  targetCPUUtilizationPercentage: 80
