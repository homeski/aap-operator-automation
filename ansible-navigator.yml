---
ansible-navigator:
  ansible:
    inventory:
      entries:
        - ./inventory/hosts.ini
  execution-environment:
    environment-variables:
      set:
        KUBECONFIG: "/usr/share/.kube/config"
    image: localhost/ansible-execution-env:27
    pull:
      policy: missing
    volume-mounts:
      - dest: /usr/share/ansible/collections/ansible_collections/aap/platform_on_ocp
        src: "${HOME}/.ansible/collections/ansible_collections/aap/platform_on_ocp"
        options: Z
      - dest: /usr/share/.kube
        src: "${HOME}/.kube"
        options: "Z,ro"
  logging:
    file: /tmp/ansible-navigator.log
  mode: stdout
  playbook-artifact:
    enable: false
...
