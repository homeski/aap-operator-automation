---
operatorgroups:
  - metadata:
      name: ansible-automation-platform-operator-24
      namespace: aap-24-operator
    spec:
      targetNamespaces:
        - aap-bowser

  - metadata:
      name: ansible-automation-platform-operator-26
      namespace: aap-26-operator
    spec:
      targetNamespaces:
        - aap-mario
        - aap-peach

  - metadata:
      name: ansible-automation-platform-operator-27
      namespace: aap-27-operator
    spec:
      targetNamespaces:
        - aap-koopa

  - metadata:
      name: automation-orchestrator-operator
      namespace: automation-orchestrator

subscriptions:
  - metadata:
      name: ansible-automation-platform-operator-24
      namespace: aap-24-operator
    spec:
      channel: stable-2.4-cluster-scoped

  - metadata:
      name: ansible-automation-platform-operator-26
      namespace: aap-26-operator
    spec:
      channel: stable-2.6-cluster-scoped

  - metadata:
      name: ansible-automation-platform-operator-27
      namespace: aap-27-operator
    spec:
      channel: stable-2.7-cluster-scoped
      # Working pre-networkpolicies version
      startingCSV: aap-operator.v2.7.0-0.1785438991

  - metadata:
      name: automation-orchestrator-operator
      namespace: automation-orchestrator
    spec:
      channel: stable
      name: automation-orchestrator-operator
